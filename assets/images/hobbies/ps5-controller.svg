<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PlayStation 5 DualSense controller">
  <title>PlayStation 5 DualSense controller</title>
  <defs>
    <radialGradient id="c-bg" cx="36%" cy="26%" r="88%">
      <stop offset="0" stop-color="#1e2130"/>
      <stop offset="62%" stop-color="#101219"/>
      <stop offset="1" stop-color="#0b0c0f"/>
    </radialGradient>
    <radialGradient id="c-glow-a" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".42"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c-glow-b" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fb7185" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c-line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7d2fe"/>
      <stop offset="52%" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="c-shell" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="c-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#c-bg)"/>
  <circle cx="146" cy="128" r="212" fill="url(#c-glow-a)"/>
  <circle cx="386" cy="400" r="200" fill="url(#c-glow-b)"/>

  <g transform="translate(256 262) rotate(-6) scale(1.18)"
     fill="none" stroke="url(#c-line)" stroke-linecap="round" stroke-linejoin="round">

    <!-- L1 / R1 tucked behind the top edge -->
    <g stroke-width="3" opacity=".55" fill="#ffffff" fill-opacity=".05">
      <rect x="-134" y="-80" width="46" height="22" rx="11"/>
      <rect x="88" y="-80" width="46" height="22" rx="11"/>
    </g>

    <!-- shell -->
    <path d="M-70-80C-40-92 40-92 70-80C100-70 118-58 130-38C150-4 162 44 150 86C142 116 118 128 98 116C78 102 62 72 50 44C40 22 22 10 0 10C-22 10-40 22-50 44C-62 72-78 102-98 116C-118 128-142 116-150 86C-162 44-150-4-130-38C-118-58-100-70-70-80Z"
          fill="url(#c-shell)" stroke-width="4"/>
    <!-- top gloss -->
    <path d="M-64-72C-36-82 36-82 64-72" stroke="#ffffff" stroke-opacity=".26" stroke-width="2.5"/>
    <!-- grip seams -->
    <path d="M-110 104C-124 92-131 66-127 40" stroke="#ffffff" stroke-opacity=".09" stroke-width="2.2"/>
    <path d="M110 104C124 92 131 66 127 40" stroke="#ffffff" stroke-opacity=".09" stroke-width="2.2"/>

    <!-- touchpad -->
    <rect x="-44" y="-66" width="88" height="52" rx="11" fill="#ffffff" fill-opacity=".07" stroke-width="3"/>
    <!-- light bar hugging the touchpad -->
    <g stroke="url(#c-bar)" stroke-width="4.5" opacity=".95">
      <path d="M-52-60v40"/>
      <path d="M52-60v40"/>
    </g>

    <!-- d-pad -->
    <path d="M-8-24h16v16h16v16h-16v16h-16v-16h-16v-16h16Z"
          transform="translate(-88 -28)" fill="#ffffff" fill-opacity=".08" stroke-width="3"/>

    <!-- face buttons -->
    <g transform="translate(88-28)" stroke-width="2.8">
      <circle cx="0" cy="-21" r="10" fill="#ffffff" fill-opacity=".07"/>
      <circle cx="21" cy="0" r="10" fill="#ffffff" fill-opacity=".07"/>
      <circle cx="0" cy="21" r="10" fill="#ffffff" fill-opacity=".07"/>
      <circle cx="-21" cy="0" r="10" fill="#ffffff" fill-opacity=".07"/>
      <g stroke="#ffffff" stroke-opacity=".55" stroke-width="2">
        <path d="M0-26l4.5 8h-9Z"/>
        <circle cx="21" cy="0" r="4.5" fill="none"/>
        <path d="M-3.5 17.5l7 7M3.5 17.5l-7 7"/>
        <rect x="-25.5" y="-4.5" width="9" height="9" fill="none"/>
      </g>
    </g>

    <!-- create / options -->
    <g stroke="#ffffff" stroke-opacity=".4" stroke-width="2.6">
      <path d="M-70-62l6-10"/>
      <path d="M70-62l-6-10"/>
    </g>

    <!-- thumbsticks -->
    <g stroke-width="3.5">
      <circle cx="-46" cy="42" r="27" fill="#ffffff" fill-opacity=".07"/>
      <circle cx="-46" cy="42" r="18" fill="#0b0c0f" fill-opacity=".45" stroke="#ffffff" stroke-opacity=".3" stroke-width="2.5"/>
      <circle cx="46" cy="42" r="27" fill="#ffffff" fill-opacity=".07"/>
      <circle cx="46" cy="42" r="18" fill="#0b0c0f" fill-opacity=".45" stroke="#ffffff" stroke-opacity=".3" stroke-width="2.5"/>
    </g>

    <!-- ps home button -->
    <circle cx="0" cy="26" r="8" fill="#ffffff" fill-opacity=".08" stroke-width="2.5"/>
    <!-- speaker grille -->
    <g fill="#ffffff" fill-opacity=".22">
      <circle cx="-9" cy="-2" r="1.8"/><circle cx="0" cy="-2" r="1.8"/><circle cx="9" cy="-2" r="1.8"/>
    </g>
  </g>
</svg>
